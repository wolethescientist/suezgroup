# Local Postgres for SuezERP. Production runs on Neon instead — lib/db.ts
# picks the driver from the connection string, so nothing else changes.
services:
  db:
    image: postgres:17-alpine
    container_name: suez-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: suez
      POSTGRES_PASSWORD: suez
      POSTGRES_DB: erp
    ports:
      - "5433:5432"
    volumes:
      - suez-erp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suez -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  suez-erp-pgdata:
